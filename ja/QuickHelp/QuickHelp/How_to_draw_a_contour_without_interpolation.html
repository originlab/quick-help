<h1 class="firstHeading">FAQ-1233 補間なしで等高線図を描く方法は？</h1><p class='urlname' style='display: none'>Contour-without-Interpolation</p>
<p class='faqID'>最終更新日：2025/12/24</p>
<p>Originでは、等高線図を作成する際、入力データは常に内部的に補間されます。
</p><p><span class='headerInParagraph'>補間なしで等高線図を描く方法： </span>
</p>
<dl><dd>代わりにヒートマップを使用してください。メニューの<b>作図 &gt; 等高線図、ヒートマップ &gt; ヒートマップ</b>を選択します。</dd></dl>
<hr class='keywordshr'><p><span class='keywords'>キーワード:</span><span class='keywordsInput'>2D等高線図、スムージングなし<keywords></span></p>
