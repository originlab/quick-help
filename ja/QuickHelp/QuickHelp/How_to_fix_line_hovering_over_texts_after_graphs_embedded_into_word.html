<h1 class="firstHeading">FAQ-1203 グラフをMicrosoft Wordに埋め込んだ後、グラフのテキストの上に線が表示されます。どのようにしたらよいでしょうか？</h1>
<p class='urlname' style='display: none'>Line-Hovering-over-Texts</p>
<p class='faqID'>最終更新日：2024/8/19</p>
<p>Origin 2024では、Microsoft Wordに埋め込まれたグラフのテキストの上に線が表示されるという報告があります。ただし、この問題はOrigin 2024bで修正されています。</p>
<p>Originをバージョン2024bまたはそれ以降のバージョンにアップグレードすることで問題を解決できます。</p>
