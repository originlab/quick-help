<h1 class="firstHeading">FAQ-1212 区間プロットおよび多変量管理図の平均の参照線が異なるのはなぜですか。</h1><p class='urlname' style='display: none'>mean-reference-line-wrong</p>
<p class='faqID'>最終更新日：2025/1/22</p>
<p>平均値の参照線を区間プロットまたは多変量管理図に追加すると、参照線の値がデータセット全体の平均値と異なる場合があります。
</p><p>この問題が発生した場合は、<b>軸</b>ダイアログの<b>参照線</b>タブの<b>計算値の軸スケール範囲内のデータを使用</b>のチェックを外します。 
</p><p>チェックがついている場合、参照線はデータセット全体ではなく軸スケール範囲のデータから計算されます。
</p><p><a  class="image"><img alt="Reference Use Data Axis Scale.png" src="../images/Why_the_mean_reference_line_is_wrong/800px-Reference_Use_Data_Axis_Scale.png" width="869"   /></a>
</p>
