<h1 class="firstHeading">1.145 FAQ-759 怎样创建按频率显示的分布直方图？</h1><p class='urlname' style='display: none'>Histogram-Relative-Frequency</p>
<p class='faqID'>Last Update: 12/13/2025</p>
<p>通常直方图中显示的是频数， 如果想要在直方图中显示频率：
</p>
<ul><li> 双击直方图打开 <b>绘图细节</b> 对话框。</li>
<li> 在 <b>数据</b> 选项卡中，从 <b>数据高度</b> 下拉列表中选择</li></ul>
