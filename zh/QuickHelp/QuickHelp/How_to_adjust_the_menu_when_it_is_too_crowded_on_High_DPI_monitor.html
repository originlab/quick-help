<h1 class="firstHeading">5.92 FAQ-1227 高分辨率显示器上拥挤的菜单该如何调整？</h1><p class='urlname' style='display: none'>Adjust-Menu-on-High-DPI</p>
<p class='faqID'>Last Update: 11/11/2025</p>
<p>在高分辨率显示器上，Origin 的主菜单显得拥挤，字体也很小。
</p><p>我们提供两个<a class="external text" href="../../LabTalk/LabTalk/System_Variable_List.html">系统变量</a>来调整菜单之间的间距以及菜单和对话框标题的字体大小。
</p>
<ul><li> <b>@sfsf</b>: 更改菜单和对话框标题的字体大小。</li></ul>
<dl><dd>默认值 = 117。改为 125 可增大字体。设为 100 则恢复以前的字体大小。</dd></dl>
<ul><li> <b>@sfsg</b>: 调整菜单间距。</li></ul>
<dl><dd>默认值 = 45。改成 60 可以增大间距。</dd></dl>
<p>更改数值后，需要重启 Origin 才能看到更改。
</p>
