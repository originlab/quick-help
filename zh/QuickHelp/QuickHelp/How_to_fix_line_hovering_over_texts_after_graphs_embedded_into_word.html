<h1 class="firstHeading">1.300 FAQ-1203 图嵌入 Microsoft Word 后，文本上方出现悬停线条。该怎么办？</h1><p class='urlname' style='display: none'>Line-Hovering-over-Texts</p>
<p class='faqID'>Last Update: 10/25/2024</p>
<p>有报告称，在 Origin 2024 中，图嵌入 Microsoft Word 后，有线条悬停在图的文本上方。该问题已在 Origin 2024b 中解决。
</p><p>请将 Origin 升级到 2024b 或更高版本就可解决此问题。
</p>
