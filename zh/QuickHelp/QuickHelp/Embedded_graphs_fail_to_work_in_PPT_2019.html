<h1 class="firstHeading">1.301 FAQ-1204 可编辑图无法粘贴到 MS Powerpoint 2019 上，该怎么办？</h1><p class='urlname' style='display: none'>Embedded-Graphs-Fail-in-PPT</p>
<p class='faqID'>Last Update: 10/24/2024</p>
<p><br />
我们收到报告称 Origin 图无法通过<b>编辑：复制页面</b>嵌入到 MS PowerPoint 2019 中。在 PowerPoint 文档中仅粘贴了图像，后续无法通过双击图来编辑。
</p><p>这是 MS PowerPoint 2019 的一个漏洞。请注意，当您遇到此问题时，从 Excel 复制并粘贴为嵌入对象也不起作用。
</p><p>可通过将 MS Office 升级到其他版本以解决此问题。
</p>
